<div style="width:100%;max-width:100%;overflow:hidden;background:#fbf8f3;">
  <iframe
    id="nvplush-christmas-site"
    src="https://raw.githack.com/JamKarry/22studio-images/83a61f58730e40310ddd73b76a1899b38cead918/nvplush-christmas/index.html"
    title="NVPLUSH Christmas collection"
    loading="eager"
    style="display:block;width:100%;height:100vh;min-height:760px;border:0;background:#fbf8f3;overflow:hidden;"
    scrolling="no"
    allow="clipboard-write"
  ></iframe>
</div>

<script>
  window.addEventListener('message', function (event) {
    if (event.origin !== 'https://raw.githack.com') return;
    if (!event.data || event.data.type !== 'nvplush:height') return;
    var frame = document.getElementById('nvplush-christmas-site');
    if (frame) frame.style.height = Math.max(760, Number(event.data.height) || 0) + 'px';
  });
</script>
